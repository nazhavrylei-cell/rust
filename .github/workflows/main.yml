name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile
        run: rustc -O --edition 2021 selection.rs -o selection

      - name: Run demo
        run: printf 'demo\nsolve\nquit\n' | ./selection
        
