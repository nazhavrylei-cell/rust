name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustc -O --edition 2021 selection.rs -o selection
      - uses: actions/upload-artifact@v4
        with:
          name: selection-${{ matrix.os }}
          path: |
            selection
            selection.exe
